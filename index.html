<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>배팅오목 온라인</title><style>*{box-sizing:border-box}body{background:#151a22;color:#eee;font:16px system-ui;margin:0}main{max-width:850px;margin:auto;padding:20px}button,input{font:inherit;padding:10px;border-radius:8px;border:1px solid #657080}button{background:#dfbd83;color:#171a20;cursor:pointer}button:disabled{opacity:.45}input{background:#252c38;color:white;max-width:100%}a{color:#dfbd83}canvas{width:100%;max-width:560px;display:block;touch-action:manipulation;border-radius:9px}section{background:#232b37;padding:16px;border-radius:12px;margin:14px 0}#game{display:none}#bets input{width:75px}#msg{color:#f2c87e;min-height:24px}h1{margin-bottom:4px}</style><main><h1>배팅오목 ONLINE</h1><p>비밀 배팅 · 실시간 1대1</p><section id="lobby"><input id="name" placeholder="닉네임" maxlength="20"><p><button id="create">방 만들기</button> <button id="join">방 참가</button></p><input id="room" placeholder="방 코드"><p><a href="/ai.html">AI와 대결하기</a></p></section><div id="game"><section><div id="who"></div><p id="status"></p><button id="share">초대 링크 복사</button> <button id="again" hidden>재대결 요청</button></section><canvas id="board" width="600" height="600"></canvas><section id="selectBox"><button id="select">세 자리 확정</button> <button id="clear">선택 초기화</button></section><section id="bets" hidden><div id="budget"></div><p>① <input type="number" min="1" value="1"> ② <input type="number" min="1" value="1"> ③ <input type="number" min="1" value="1"></p><button id="bet">비밀 배팅 확정</button></section></div><p id="msg"></p></main><script>
const $=id=>document.getElementById(id), c=$('board'),ctx=c.getContext('2d'), inputs=[...$('bets').querySelectorAll('input')];let session=null,s=null,pick=[],busy=false,seq=0;const invite=new URL(location.href).searchParams.get('room');$('room').value=invite||'';if(invite){$('create').hidden=true;}function msg(t){$('msg').textContent=t;}async function api(action,data){let opt={headers:{Authorization:session?.key||''}};let url='/api/'+action;if(data){opt.method='POST';opt.headers['Content-Type']='application/json';opt.body=JSON.stringify({...data,id:session?.id||data.id});}else url+='?id='+session.id;let r=await fetch(url,opt),v=await r.json();if(!r.ok)throw Error(v.error);return v;}function draw(){ctx.fillStyle='#c69b65';ctx.fillRect(0,0,600,600);ctx.strokeStyle='#745237';for(let i=0;i<15;i++){let q=24+i*39.4;ctx.beginPath();ctx.moveTo(q,24);ctx.lineTo(q,575.6);ctx.moveTo(24,q);ctx.lineTo(575.6,q);ctx.stroke();}s.board.forEach((v,i)=>{let x=24+i%15*39.4,y=24+Math.floor(i/15)*39.4;if(v){ctx.beginPath();ctx.arc(x,y,16,0,Math.PI*2);ctx.fillStyle=v===1?'#fafafa':'#171a1d';ctx.fill();if(s.last.includes(i)){ctx.strokeStyle='#e78e39';ctx.lineWidth=2;ctx.stroke();ctx.lineWidth=1;}}});(s.cells||pick).forEach((i,j)=>{let x=24+i%15*39.4,y=24+Math.floor(i/15)*39.4;ctx.beginPath();ctx.arc(x,y,15,0,7);ctx.fillStyle='#2878b8';ctx.fill();ctx.fillStyle='white';ctx.font='bold 16px system-ui';ctx.textAlign='center';ctx.fillText(j+1,x,y+6);});}function render(v){if(!s||s.round!==v.round){pick=[];inputs.forEach(i=>i.value=1);}s=v;let p=session.p;$('who').textContent=`나: ${s.names[p]} (${p===1?'백돌':'흑돌'}) · 내 포인트 ${s.points} | 상대: ${s.names[3-p]} (?)`;$('status').textContent=!s.joined?'친구의 접속을 기다리는 중':s.result?s.result==='draw'?'무승부':s.result===p?'승리!':'패배':`라운드 ${s.round} · ${s.selector===p?'내가 선택자':'상대가 선택자'} · ${s.cells?s.ready?'내 배팅 완료, 상대 대기':s.otherReady?'상대 배팅 완료':'비밀 배팅 진행 중':'자리 선택 중'}`;$('selectBox').hidden=!s.joined||!!s.result||!!s.cells||s.selector!==p;$('bets').hidden=!s.joined||!!s.result||!s.cells||s.ready;$('budget').textContent='사용 가능: '+s.points+'점 · 남은 점수의 절반 이월';$('again').hidden=!s.result;$('again').disabled=s.again;$('select').disabled=pick.length!==3;draw();}async function poll(){if(!session||busy)return;let n=++seq;try{let v=await api('state');if(n===seq)render(v);}catch(e){msg(e.message);}}async function act(a,d){if(busy)return;busy=true;seq++;try{render(await api(a,d));msg('');}catch(e){msg(e.message);}finally{busy=false;}}async function enter(a){try{session=await api(a,{name:$('name').value,id:$('room').value.trim()});sessionStorage.setItem('gomoku-session',JSON.stringify(session));$('lobby').style.display='none';$('game').style.display='block';await poll();}catch(e){msg(e.message);}}$('create').onclick=()=>enter('create');$('join').onclick=()=>enter('join');$('share').onclick=async()=>{let u=new URL(location.href);u.search='?room='+session.id;try{await navigator.clipboard.writeText(u.href);msg('초대 링크 복사 완료');}catch{prompt('친구에게 공유할 링크',u.href);}};c.onclick=e=>{if(!s||$('selectBox').hidden||busy)return;let r=c.getBoundingClientRect(),x=Math.round(((e.clientX-r.left)*600/r.width-24)/39.4),y=Math.round(((e.clientY-r.top)*600/r.height-24)/39.4);if(x<0||x>14||y<0||y>14||s.board[y*15+x])return;let i=y*15+x;if(pick.includes(i))pick=pick.filter(v=>v!==i);else if(pick.length<3)pick.push(i);$('select').disabled=pick.length!==3;draw();};$('clear').onclick=()=>{pick=[];render(s);};$('select').onclick=()=>act('select',{round:s.round,cells:pick});$('bet').onclick=()=>act('bet',{round:s.round,bets:inputs.map(i=>Number(i.value))});$('again').onclick=()=>act('again',{});setInterval(poll,700);try{let old=JSON.parse(sessionStorage.getItem('gomoku-session'));if(old&&(!invite||old.id===invite)){session=old;$('lobby').style.display='none';$('game').style.display='block';poll();}}catch{}
</script></html>
